name: Build Gold Brief

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the dashboard
        run: |
          python build_gold_brief.py
          cp gold-brief.html index.html

      - name: Publish the updated page
        run: |
          git config user.name "gold-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto update $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push
